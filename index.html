<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 | 卡塞尔学院</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at top left, rgba(218,165,32,0.08), transparent 35%),
    linear-gradient(180deg, #050505 0%, #111111 45%, #080808 100%);
  color:#fff;
  text-align:center;
  position:relative;
  overflow-x:hidden;
}
#canvas{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:1;
}
.wrap{
  position:relative;
  z-index:3;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  padding-bottom:60px;
}
.badge{
  width:186px;
  height:186px;
  border-radius:50%;
  border:3px solid rgba(218,165,32,0.65);
  background:
    radial-gradient(circle at 35% 25%, rgba(255,215,0,0.12), transparent 35%),
    linear-gradient(135deg, #1a1a1a, #0d0d0d);
  box-shadow:
    0 0 34px rgba(218,165,32,0.45),
    inset 0 0 22px rgba(218,165,32,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
  position:relative;
  overflow:hidden;
}
.badge img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  filter: drop-shadow(0 0 12px rgba(218,165,32,0.65));
}
h1{
  font-size:clamp(2.2rem,9vw,3.2rem);
  color:gold;
  margin-bottom:20px;
  letter-spacing:3px;
  text-shadow:
    0 0 10px rgba(255,215,0,0.75),
    0 0 20px rgba(255,215,0,0.4);
}
.content{
  max-width:560px;
  font-size:clamp(1rem,4vw,1.3rem);
  line-height:2;
  color:rgba(255,255,255,0.85);
  background:rgba(18,18,18,0.7);
  border:1px solid rgba(218,165,32,0.28);
  border-radius:16px;
  padding:26px 30px;
  box-shadow:0 0 24px rgba(218,165,32,0.14);
}
.content p{ margin-bottom:14px; }
.sign{
  margin-top:20px;
  font-size:0.95rem;
  color:rgba(218,165,32,0.78);
  letter-spacing:1px;
}
.dragon-line{
  position:absolute;
  width:200px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(218,165,32,0.65), transparent);
  top:20%;
  left:50%;
  transform:translateX(-50%);
  box-shadow:0 0 14px rgba(218,165,32,0.45);
}
.bottom-name{
  position:absolute;
  right:18px;
  bottom:18px;
  font-size:0.95rem;
  color:gold;
  letter-spacing:1px;
  text-shadow:
    0 0 8px rgba(255,215,0,0.8),
    0 0 16px rgba(255,215,0,0.5);
  z-index:4;
}

/* ================= 时间组件（右上角，按钮在左） ================= */
.time-box{
  position:fixed;
  top:16px;
  right:16px;
  z-index:6;
  background:rgba(12,12,12,0.75);
  border:1px solid rgba(218,165,32,0.35);
  border-radius:12px;
  box-shadow:0 0 18px rgba(218,165,32,0.16);
  display:flex;
  align-items:stretch;
  transform:translateX(calc(100% + 16px));
  opacity:0;
  transition:transform 0.7s ease-out, opacity 0.7s ease;
}
.time-box.show{ transform:translateX(0); opacity:1; }

.time-fold-btn{
  width:24px;
  flex:0 0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(218,165,32,0.75);
  cursor:pointer;
  border-right:1px solid rgba(218,165,32,0.25);
  border-radius:12px 0 0 12px;
  user-select:none;
}
.time-main{
  width:196px;
  padding:10px 14px;
  text-align:right;
  overflow:hidden;
  transition:width 0.35s ease, padding 0.35s ease;
}
.time-box.collapsed .time-main{
  width:0;
  padding:10px 0;
}
.time-date{
  font-size:0.8rem;
  color:rgba(218,165,32,0.75);
  letter-spacing:1px;
  margin-bottom:4px;
  white-space:nowrap;
}
.time-clock{
  font-size:1.3rem;
  color:gold;
  letter-spacing:2px;
  white-space:nowrap;
  text-shadow:0 0 10px rgba(255,215,0,0.6);
}

/* ================= 音乐播放器（左下角，按钮在右） ================= */
.music-wrap{
  position:fixed;
  left:16px;
  bottom:16px;
  z-index:6;
  background:rgba(12,12,12,0.75);
  border:1px solid rgba(218,165,32,0.35);
  border-radius:12px;
  box-shadow:0 0 18px rgba(218,165,32,0.16);
  display:flex;
  align-items:stretch;
  transform:translateX(calc(-100% - 24px));
  opacity:0;
  transition:transform 0.7s ease-out, opacity 0.7s ease;
}
.music-wrap.show{ transform:translateX(0); opacity:1; }

/* 宽度保持 220px 不变，只把高度压扁 */
.music-main{
  width:220px;
  padding:8px 14px;            /* 上下内边距变小 */
  overflow:hidden;
  transition:width 0.35s ease, padding 0.35s ease;
}
.music-wrap.collapsed .music-main{
  width:0;
  padding:8px 0;
}

.music-fold-btn{
  width:24px;
  flex:0 0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(218,165,32,0.75);
  cursor:pointer;
  border-left:1px solid rgba(218,165,32,0.25);
  border-radius:0 12px 12px 0;
  user-select:none;
}

.music-title{
  color:gold;
  font-size:0.85rem;
  margin-bottom:6px;           /* 更紧 */
  letter-spacing:1px;
  text-align:center;
  white-space:nowrap;
}

/* 播放按钮与标题同一行，整体更扁 */
.music-row-top{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:6px;           /* 更紧 */
}
.music-toggle{
  background:#1c1c1c;
  color:#fff;
  border:1px solid rgba(218,165,32,0.45);
  border-radius:50%;
  width:28px;                  /* 按钮变小 */
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:12px;
  flex-shrink:0;
}
.music-toggle:hover{
  border-color:gold;
  box-shadow:0 0 8px rgba(218,165,32,0.4);
}
.music-toggle.playing{ color:gold; }

.progress-wrap{
  width:100%;
  height:5px;                  /* 进度条更细 */
  background:#222;
  border-radius:3px;
  position:relative;
  cursor:pointer;
  touch-action:none;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#d4af37,#ffd700);
  border-radius:3px;
  width:0%;
}
.progress-thumb{
  position:absolute;
  left:0;
  top:50%;
  width:11px;
  height:11px;
  background:gold;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px gold;
}
.time-text{
  display:flex;
  justify-content:space-between;
  font-size:0.7rem;
  color:rgba(218,165,32,0.65);
  margin-top:3px;              /* 更紧 */
}

audio{ display:none; }

@media(max-width:480px){
  .badge{ width:156px; height:156px; }
  .content{ padding:20px 22px; }
  .bottom-name{ right:12px; bottom:12px; font-size:0.85rem; }

  .time-box{ top:10px; right:10px; }
  .time-main{ width:168px; padding:8px 12px; }
  .time-clock{ font-size:1.05rem; }
  .time-date{ font-size:0.72rem; }

  .music-wrap{ left:10px; bottom:10px; }
  .music-main{ width:180px; padding:7px 10px; }  /* 宽度不变，高度更扁 */
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- 时间组件：按钮在左，内容在右 -->
<div class="time-box" id="timeBox">
  <div class="time-fold-btn" id="timeFoldBtn">◀</div>
  <div class="time-main">
    <div class="time-date" id="dateDom"></div>
    <div class="time-clock" id="timeDom"></div>
  </div>
</div>

<!-- 音乐播放器：内容在左，按钮在右 -->
<div class="music-wrap" id="musicWrap">
  <div class="music-main">
    <div class="music-title">心似烟火</div>
    <div class="music-row-top">
      <button class="music-toggle" id="musicToggle">▶</button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="time-text">
      <span id="curTime">00:00</span>
      <span id="durTime">00:00</span>
    </div>
  </div>
  <div class="music-fold-btn" id="musicFoldBtn">▶</div>
</div>

<!-- 音频 -->
<audio id="bgAudio" preload="metadata" loop>
  <source src="xinshiyanhuo.mp3" type="audio/mpeg">
</audio>

<div class="wrap">
  <div class="dragon-line"></div>
  <div class="badge">
    <img src="https://s41.ax1x.com/2026/10/06/pntkM8J.jpg" alt="徽章">
  </div>
  <h1>生日蛋糕是青春的墓碑</h1>
  <div class="content">
    <p>8月26日，属于你的日子。</p>
    <p>愿新岁，你的黄金瞳永远明亮。</p>
    <p>纵然世间有龙影蛰伏，也愿你被温柔与好运庇护。</p>
    <p>不必活成别人的英雄，只做属于自己的光。</p>
    <p>前路浩荡，万事尽可期待。</p>
    <p class="sign">——卡塞尔学院</p>
  </div>
</div>

<div class="bottom-name">佟浩嘉</div>

<script>
/* ==================== 粒子背景 ==================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class ScaleParticle{
  constructor(){
    this.x = Math.random() * w;
    this.y = -30;
    this.size = Math.random() * 4 + 1.5;
    this.speedY = Math.random() * 1.2 + 0.6;
    this.speedX = (Math.random() - 0.5) * 0.6;
    this.rotate = Math.random() * Math.PI * 2;
    this.rotateSpeed = (Math.random() - 0.5) * 0.03;
    this.alpha = Math.random() * 0.45 + 0.2;
    this.color = Math.random() > 0.5 ? '#ffd700' : '#d4af37';
  }
  update(){
    this.y += this.speedY;
    this.x += this.speedX;
    this.rotate += this.rotateSpeed;
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotate);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const scaleList = [];
function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, w, h);

  if (Math.random() < 0.22) scaleList.push(new ScaleParticle());

  for (let i = scaleList.length - 1; i >= 0; i--){
    const p = scaleList[i];
    p.update();
    p.draw();
    if (p.y > h + 20) scaleList.splice(i, 1);
  }
}
animate();

/* ==================== 时间组件 ==================== */
const dateDom = document.getElementById('dateDom');
const timeDom = document.getElementById('timeDom');
const timeBox = document.getElementById('timeBox');
const timeFoldBtn = document.getElementById('timeFoldBtn');

function padZero(n){
  return n.toString().padStart(2, '0');
}
function updateDateTime(){
  const now = new Date();
  const y = now.getFullYear();
  const m = padZero(now.getMonth() + 1);
  const d = padZero(now.getDate());
  const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const week = weekArr[now.getDay()];
  dateDom.innerText = `${y}年${m}月${d}日 ${week}`;
  timeDom.innerText = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
}
updateDateTime();
setInterval(updateDateTime, 1000);

setTimeout(() => timeBox.classList.add('show'), 2000);

timeFoldBtn.addEventListener('click', () => {
  timeBox.classList.toggle('collapsed');
  timeFoldBtn.textContent = timeBox.classList.contains('collapsed') ? '▶' : '◀';
});

/* ==================== 音乐播放器 ==================== */
const musicWrap    = document.getElementById('musicWrap');
const bgAudio      = document.getElementById('bgAudio');
const musicToggle  = document.getElementById('musicToggle');
const musicFoldBtn = document.getElementById('musicFoldBtn');
const progressWrap = document.getElementById('progressWrap');
const progressBar  = document.getElementById('progressBar');
const progressThumb= document.getElementById('progressThumb');
const curTimeDom   = document.getElementById('curTime');
const durTimeDom   = document.getElementById('durTime');

let isDragging = false;

setTimeout(() => musicWrap.classList.add('show'), 1500);

musicFoldBtn.addEventListener('click', () => {
  musicWrap.classList.toggle('collapsed');
  musicFoldBtn.textContent = musicWrap.classList.contains('collapsed') ? '◀' : '▶';
});

function formatSec(s){
  if (!isFinite(s) || s < 0) s = 0;
  return padZero(Math.floor(s / 60)) + ':' + padZero(Math.floor(s % 60));
}

bgAudio.addEventListener('play', () => {
  musicToggle.textContent = '⏸';
  musicToggle.classList.add('playing');
});
bgAudio.addEventListener('pause', () => {
  musicToggle.textContent = '▶';
  musicToggle.classList.remove('playing');
});

musicToggle.addEventListener('click', () => {
  if (bgAudio.paused) {
    bgAudio.play().catch(err => console.warn('播放失败，请检查 xinshiyanhuo.mp3：', err));
  } else {
    bgAudio.pause();
  }
});

function refreshDuration(){
  if (isFinite(bgAudio.duration)) durTimeDom.innerText = formatSec(bgAudio.duration);
}
bgAudio.addEventListener('loadedmetadata', refreshDuration);
bgAudio.addEventListener('durationchange', refreshDuration);

bgAudio.addEventListener('timeupdate', () => {
  if (isDragging) return;
  const dur = bgAudio.duration;
  if (!isFinite(dur) || dur <= 0) return;
  const pct = bgAudio.currentTime / dur;
  progressBar.style.width = (pct * 100) + '%';
  progressThumb.style.left = (pct * 100) + '%';
  curTimeDom.innerText = formatSec(bgAudio.currentTime);
});

function setProgressByX(clientX){
  const rect = progressWrap.getBoundingClientRect();
  let percent = (clientX - rect.left) / rect.width;
  percent = Math.max(0, Math.min(1, percent));
  progressBar.style.width = (percent * 100) + '%';
  progressThumb.style.left = (percent * 100) + '%';
  const dur = bgAudio.duration;
  if (isFinite(dur) && dur > 0) {
    bgAudio.currentTime = percent * dur;
    curTimeDom.innerText = formatSec(bgAudio.currentTime);
  }
}

progressWrap.addEventListener('mousedown', e => {
  e.preventDefault();
  isDragging = true;
  setProgressByX(e.clientX);
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  setProgressByX(e.clientX);
});
document.addEventListener('mouseup', () => { isDragging = false; });

progressWrap.addEventListener('touchstart', e => {
  isDragging = true;
  setProgressByX(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  setProgressByX(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchend', () => { isDragging = false; });
</script>
</body>
</html>
