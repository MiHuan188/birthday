<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生日快乐 | 卡塞尔学院</title>
<style>
:root{
  --gold: #d4af37;
  --gold-bright: #ffd700;
  --gold-soft: rgba(218,165,32,0.75);
  --gold-border: rgba(218,165,32,0.35);
  --gold-glow: rgba(218,165,32,0.45);
  --gold-faint: rgba(218,165,32,0.16);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at top left, rgba(218,165,32,0.08), transparent 35%),
    linear-gradient(180deg, #050505 0%, #111111 45%, #080808 100%);
  color:#fff;
  text-align:center;
  position:relative;
  overflow-x:hidden;
}
#canvas{
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  pointer-events:none;
  z-index:1;
}
.wrap{
  position:relative;
  z-index:3;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  padding-bottom:60px;
}
.badge{
  width:186px; height:186px;
  border-radius:50%;
  border:3px solid rgba(218,165,32,0.65);
  background:
    radial-gradient(circle at 35% 25%, rgba(255,215,0,0.12), transparent 35%),
    linear-gradient(135deg, #1a1a1a, #0d0d0d);
  box-shadow:
    0 0 34px var(--gold-glow),
    inset 0 0 22px rgba(218,165,32,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
  position:relative;
  overflow:hidden;
  animation: fadeUp 1.8s cubic-bezier(0.35, 0.1, 0.5, 1) 0.2s both;
}
.badge img{
  width:100%; height:100%;
  object-fit:cover;
  border-radius:50%;
  filter: drop-shadow(0 0 12px rgba(218,165,32,0.65));
}
h1{
  font-size:clamp(2.2rem,9vw,3.2rem);
  color:gold;
  margin-bottom:20px;
  letter-spacing:3px;
  text-shadow:
    0 0 10px rgba(255,215,0,0.75),
    0 0 20px rgba(255,215,0,0.4);
  animation: fadeUp 1.3s cubic-bezier(0.5, 0, 0.75, 0.9) 0.7s both;
}
.content{
  max-width:560px;
  font-size:clamp(1rem,4vw,1.3rem);
  line-height:2;
  color:rgba(255,255,255,0.85);
  background:rgba(18,18,18,0.7);
  border:1px solid rgba(218,165,32,0.28);
  border-radius:16px;
  padding:26px 30px;
  box-shadow:0 0 24px rgba(218,165,32,0.14);
}
.content p{
  margin-bottom:14px;
  opacity:0;
}
.sign{
  margin-top:20px;
  font-size:0.95rem;
  color:rgba(218,165,32,0.78);
  letter-spacing:1px;
}
.dragon-line{
  position:absolute;
  width:200px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(218,165,32,0.65), transparent);
  top:20%; left:50%;
  transform:translateX(-50%);
  box-shadow:0 0 14px var(--gold-glow);
  animation: fadeIn 1.6s cubic-bezier(0.35, 0.1, 0.5, 1) 0.4s both;
}
.bottom-name{
  position:absolute;
  right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font-size:0.95rem;
  color:gold;
  letter-spacing:1px;
  text-shadow:
    0 0 8px rgba(255,215,0,0.8),
    0 0 16px rgba(255,215,0,0.5);
  z-index:4;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  transition: text-shadow 0.3s ease, color 0.3s ease;
  animation: fadeIn 1s cubic-bezier(0.85, 0, 0.9, 0.05) 2.4s both;
}
.bottom-name:hover{
  color:#fff6c9;
  text-shadow:
    0 0 10px rgba(255,215,0,1),
    0 0 22px rgba(255,215,0,0.75),
    0 0 34px rgba(255,215,0,0.45);
}

@keyframes fadeUp{
  from{ opacity:0; transform: translateY(28px); }
  to{ opacity:1; transform: translateY(0); }
}
@keyframes fadeUpLaunch{
  from{ opacity:0; transform: translateY(64px); }
  to{ opacity:1; transform: translateY(0); }
}
@keyframes fadeIn{
  from{ opacity:0; }
  to{ opacity:1; }
}

/* ================= 底部小提示 ================= */
.toast{
  position:fixed;
  left:50%;
  bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(14px) scale(0.95);
  z-index:20;
  background: rgba(12,12,12,0.88);
  border:1px solid rgba(218,165,32,0.55);
  border-radius:999px;
  padding:10px 22px;
  color:gold;
  font-size:0.95rem;
  letter-spacing:1px;
  white-space:nowrap;
  box-shadow: 0 0 22px rgba(218,165,32,0.35);
  opacity:0;
  pointer-events:none;
  animation: toastPop 1.8s ease 0.5s both;
}
@keyframes toastPop{
  0%   { opacity:0; transform: translateX(-50%) translateY(14px) scale(0.95); }
  18%  { opacity:1; transform: translateX(-50%) translateY(0)   scale(1); }
  75%  { opacity:1; transform: translateX(-50%) translateY(0)   scale(1); }
  100% { opacity:0; transform: translateX(-50%) translateY(-6px) scale(0.98); }
}

/* ================= 时间组件（左下，音乐上方，等宽，贴紧） ================= */
.time-box{
  position:fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  /* 贴紧音乐：音乐高度约 89px + 间距 8px = 105px */
  bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  z-index:6;
  background:rgba(12,12,12,0.75);
  border:1px solid var(--gold-border);
  border-radius:12px;
  box-shadow:0 0 18px var(--gold-faint);
  display:flex;
  align-items:stretch;
  transform: translateX(calc(-100% - 24px));
  opacity: 0;
  transition: transform 0.7s ease-out, opacity 0.7s ease;
}
.time-box.show{ transform: translateX(0); opacity: 1; }

/* 内容区宽度与音乐一致（220px），保证整体等宽 */
.time-main{
  width:220px;
  padding:10px 14px;
  text-align:left;
  overflow:hidden;
  transition: width 0.35s ease, padding 0.35s ease;
}
.time-box.collapsed .time-main{
  width:0;
  padding:10px 0;
}

.time-fold-btn{
  width:24px;
  flex:0 0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-soft);
  cursor:pointer;
  border-left:1px solid rgba(218,165,32,0.25);
  border-radius:0 12px 12px 0;
  user-select:none;
}

.time-date{
  font-size:0.8rem;
  color:var(--gold-soft);
  letter-spacing:1px;
  margin-bottom:4px;
  white-space:nowrap;
}
.time-clock{
  font-size:1.3rem;
  color:gold;
  letter-spacing:2px;
  white-space:nowrap;
  text-shadow:0 0 10px rgba(255,215,0,0.6);
}

/* ================= 音乐播放器（左下，等宽） ================= */
.music-wrap{
  position:fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index:6;
  background:rgba(12,12,12,0.75);
  border:1px solid var(--gold-border);
  border-radius:12px;
  box-shadow:0 0 18px var(--gold-faint);
  display:flex;
  align-items:stretch;
  transform:translateX(calc(-100% - 24px));
  opacity:0;
  transition:transform 0.7s ease-out, opacity 0.7s ease;
}
.music-wrap.show{ transform:translateX(0); opacity:1; }
.music-main{
  width:220px;                    /* 与 time-main 等宽 */
  padding:8px 14px;
  overflow:hidden;
  transition:width 0.35s ease, padding 0.35s ease;
}
.music-wrap.collapsed .music-main{
  width:0;
  padding:8px 0;
}
.music-fold-btn{
  width:24px;
  flex:0 0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-soft);
  cursor:pointer;
  border-left:1px solid rgba(218,165,32,0.25);
  border-radius:0 12px 12px 0;
  user-select:none;
}
.music-title{
  color:gold;
  font-size:0.85rem;
  margin-bottom:6px;
  letter-spacing:1px;
  text-align:center;
  white-space:nowrap;
}
.music-row-top{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:6px;
}
.music-toggle{
  background:#1c1c1c;
  color:#fff;
  border:1px solid rgba(218,165,32,0.45);
  border-radius:50%;
  width:28px; height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:12px;
  flex-shrink:0;
}
.music-toggle:hover{
  border-color:gold;
  box-shadow:0 0 8px rgba(218,165,32,0.4);
}
.music-toggle.playing{ color:gold; }

.progress-wrap{
  width:100%;
  height:5px;
  background:#222;
  border-radius:3px;
  position:relative;
  cursor:pointer;
  touch-action:none;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
  border-radius:3px;
  width:0%;
}
.progress-thumb{
  position:absolute;
  left:0; top:50%;
  width:11px; height:11px;
  background:gold;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px gold;
}
.time-text{
  display:flex;
  justify-content:space-between;
  font-size:0.7rem;
  color:var(--gold-soft);
  margin-top:3px;
}

audio{ display:none; }

@media(max-width:480px){
  .badge{ width:156px; height:156px; }
  .content{ padding:20px 22px; }

  .bottom-name{
    right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font-size:0.85rem;
  }

  /* 时间：左下，音乐上方，等宽 180px */
  .time-box{
    left: calc(10px + env(safe-area-inset-left, 0px));
    bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  }
  .time-main{ width:180px; padding:8px 12px; }
  .time-clock{ font-size:1.05rem; }
  .time-date{ font-size:0.72rem; }

  .music-wrap{
    left: calc(10px + env(safe-area-inset-left, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .music-main{ width:180px; padding:7px 10px; }

  .toast{
    bottom: calc(140px + env(safe-area-inset-bottom, 0px));
    font-size:0.88rem;
    padding:9px 18px;
  }
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- 底部小提示 -->
<div class="toast" id="toast">🎁 有彩蛋，你找找</div>

<!-- 时间组件（左下，音乐上方，按钮在右） -->
<div class="time-box" id="timeBox">
  <div class="time-main">
    <div class="time-date" id="dateDom"></div>
    <div class="time-clock" id="timeDom"></div>
  </div>
  <div class="time-fold-btn" id="timeFoldBtn">▶</div>
</div>

<!-- 音乐播放器（左下） -->
<div class="music-wrap" id="musicWrap">
  <div class="music-main">
    <div class="music-title">心似烟火</div>
    <div class="music-row-top">
      <button class="music-toggle" id="musicToggle" aria-label="播放或暂停">▶</button>
    </div>
    <div class="progress-wrap" id="progressWrap" role="slider" aria-label="播放进度">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="time-text">
      <span id="curTime">00:00</span>
      <span id="durTime">00:00</span>
    </div>
  </div>
  <div class="music-fold-btn" id="musicFoldBtn">▶</div>
</div>

<!-- 音频 -->
<audio id="bgAudio" preload="auto" loop>
  <source src="xinshiyanhuo.mp3" type="audio/mpeg">
</audio>

<div class="wrap">
  <div class="dragon-line"></div>
  <div class="badge">
    <img src="https://s41.ax1x.com/2026/10/06/pntkM8J.jpg" alt="徽章">
  </div>
  <h1>生日蛋糕是青春的墓碑</h1>
  <div class="content">
    <p>8月26日，属于你的日子。</p>
    <p>愿新岁，你的黄金瞳永远明亮。</p>
    <p>纵然世间有龙影蛰伏，也愿你被温柔与好运庇护。</p>
    <p>不必活成别人的英雄，只做属于自己的光。</p>
    <p>前路浩荡，万事尽可期待。</p>
    <p class="sign">——卡塞尔学院</p>
  </div>
</div>

<div class="bottom-name" id="bottomName" title="点一下试试？">佟浩嘉</div>

<script>
/* ==================== 粒子背景 ==================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w, h;

const isMobile = window.innerWidth < 768;
const spawnRate = isMobile ? 0.10 : 0.22;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class ScaleParticle{
  constructor(){
    this.x = Math.random() * w;
    this.y = -30;
    this.size = Math.random() * 4 + 1.5;
    this.speedY = Math.random() * 1.2 + 0.6;
    this.speedX = (Math.random() - 0.5) * 0.6;
    this.rotate = Math.random() * Math.PI * 2;
    this.rotateSpeed = (Math.random() - 0.5) * 0.03;
    this.alpha = Math.random() * 0.45 + 0.2;
    this.color = Math.random() > 0.5 ? '#ffd700' : '#d4af37';
  }
  update(){
    this.y += this.speedY;
    this.x += this.speedX;
    this.rotate += this.rotateSpeed;
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotate);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class LightStreak{
  constructor(x1, y1, x2, y2){
    this.x1 = x1; this.y1 = y1;
    this.x2 = x2; this.y2 = y2;
    this.life = 1;
    this.width = 10 + Math.random() * 8;
  }
  update(){ this.life -= 0.045; }
  draw(){
    if (this.life <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255, 180, 0, 1)';
    ctx.shadowBlur = 26;
    const grad = ctx.createLinearGradient(this.x1, this.y1, this.x2, this.y2);
    grad.addColorStop(0,   'rgba(184, 134, 11, 0)');
    grad.addColorStop(0.35,'rgba(218, 165, 32, ' + (this.life * 0.9) + ')');
    grad.addColorStop(0.6, 'rgba(255, 165, 0, ' + (this.life * 0.95) + ')');
    grad.addColorStop(1,   'rgba(255, 215, 0, 0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.width * this.life;
    ctx.beginPath();
    ctx.moveTo(this.x1, this.y1);
    ctx.lineTo(this.x2, this.y2);
    ctx.stroke();
    ctx.shadowBlur = 8;
    ctx.strokeStyle = 'rgba(255, 240, 160, ' + (this.life * 0.85) + ')';
    ctx.lineWidth = Math.max(1, this.width * this.life * 0.28);
    ctx.beginPath();
    ctx.moveTo(this.x1, this.y1);
    ctx.lineTo(this.x2, this.y2);
    ctx.stroke();
    ctx.restore();
  }
}

class TrailScale{
  constructor(x, y, burst){
    const angle = Math.random() * Math.PI * 2;
    const speed = burst ? (1.2 + Math.random() * 4.5) : (0.2 + Math.random() * 1.4);
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (burst ? 0.8 : 0.3);
    this.size = burst ? (4 + Math.random() * 6) : (2.5 + Math.random() * 4);
    this.scaleY = 0.5 + Math.random() * 0.35;
    this.alpha = 1;
    this.decay = burst ? (0.010 + Math.random() * 0.012) : (0.014 + Math.random() * 0.016);
    const colors = ['#FFD700', '#FFB90F', '#FFA500', '#DAA520', '#B8860B'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.rotate = Math.random() * Math.PI * 2;
    this.rotateSpeed = (Math.random() - 0.5) * 0.14;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.94;
    this.vy *= 0.94;
    this.vy += 0.035;
    this.alpha -= this.decay;
    this.size *= 0.985;
    this.rotate += this.rotateSpeed;
  }
  draw(){
    if (this.alpha <= 0 || this.size < 0.3) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotate);
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 22;
    ctx.globalAlpha = Math.max(0, this.alpha * 0.65);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size * 1.5, this.size * this.scaleY * 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * this.scaleY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = Math.max(0, this.alpha * 0.9);
    ctx.fillStyle = 'rgba(255, 240, 180, 0.95)';
    ctx.beginPath();
    ctx.ellipse(-this.size * 0.22, -this.size * 0.22,
                this.size * 0.42, this.size * this.scaleY * 0.38,
                0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const scaleList = [];
const trailList = [];
const streakList = [];

function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, w, h);

  if (Math.random() < spawnRate) scaleList.push(new ScaleParticle());
  for (let i = scaleList.length - 1; i >= 0; i--){
    const p = scaleList[i];
    p.update();
    p.draw();
    if (p.y > h + 20) scaleList.splice(i, 1);
  }

  for (let i = streakList.length - 1; i >= 0; i--){
    const s = streakList[i];
    s.update();
    s.draw();
    if (s.life <= 0) streakList.splice(i, 1);
  }

  for (let i = trailList.length - 1; i >= 0; i--){
    const p = trailList[i];
    p.update();
    p.draw();
    if (p.alpha <= 0 || p.size < 0.3) trailList.splice(i, 1);
  }
}
animate();

let lastX = -999, lastY = -999;

function spawnTrail(x, y, isBurst){
  if (!isBurst && lastX > -900){
    streakList.push(new LightStreak(lastX, lastY, x, y));
    if (streakList.length > 60){
      streakList.splice(0, streakList.length - 60);
    }
  }
  const n = isBurst ? 14 : (isMobile ? 2 : 3);
  for (let i = 0; i < n; i++){
    trailList.push(new TrailScale(x, y, isBurst));
  }
  if (trailList.length > 380){
    trailList.splice(0, trailList.length - 380);
  }
}

window.addEventListener('mousemove', (e) => {
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (dx * dx + dy * dy < 12) return;
  spawnTrail(e.clientX, e.clientY, false);
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mousedown', (e) => {
  lastX = e.clientX;
  lastY = e.clientY;
  spawnTrail(e.clientX, e.clientY, true);
});

window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  if (!t) return;
  const dx = t.clientX - lastX;
  const dy = t.clientY - lastY;
  if (dx * dx + dy * dy < 12) return;
  spawnTrail(t.clientX, t.clientY, false);
  lastX = t.clientX;
  lastY = t.clientY;
}, { passive: true });

window.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  if (!t) return;
  lastX = t.clientX;
  lastY = t.clientY;
  spawnTrail(t.clientX, t.clientY, true);
}, { passive: true });

/* ==================== 文案逐行动画 ==================== */
(function(){
  const ps = document.querySelectorAll('.content p');
  const SLOW_START = 1.4;
  const SLOW_GAP   = 0.35;
  const LAUNCH_AT  = SLOW_START + SLOW_GAP + 0.25;
  const LAUNCH_GAP = 0.08;

  ps.forEach((p, i) => {
    if (i < 2){
      p.style.animation = `fadeUp 1.1s cubic-bezier(0.35, 0.1, 0.5, 1) ${SLOW_START + i * SLOW_GAP}s both`;
    } else {
      const d = LAUNCH_AT + (i - 2) * LAUNCH_GAP;
      p.style.animation = `fadeUpLaunch 0.6s cubic-bezier(0.85, 0, 0.9, 0.05) ${d}s both`;
    }
  });
})();

/* ==================== 彩蛋入口 ==================== */
document.getElementById('bottomName').addEventListener('click', () => {
  location.href = 'caidan.html';
});

/* ==================== 时间组件 ==================== */
const dateDom = document.getElementById('dateDom');
const timeDom = document.getElementById('timeDom');
const timeBox = document.getElementById('timeBox');
const timeFoldBtn = document.getElementById('timeFoldBtn');

function padZero(n){ return n.toString().padStart(2, '0'); }

function updateDateTime(){
  const now = new Date();
  const weekArr = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  dateDom.innerText = `${now.getFullYear()}年${padZero(now.getMonth()+1)}月${padZero(now.getDate())}日 ${weekArr[now.getDay()]}`;
  timeDom.innerText = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
}
updateDateTime();
setInterval(updateDateTime, 1000);

timeFoldBtn.addEventListener('click', () => {
  timeBox.classList.toggle('collapsed');
  timeFoldBtn.textContent = timeBox.classList.contains('collapsed') ? '◀' : '▶';
});

/* ==================== 音乐播放器 ==================== */
const musicWrap    = document.getElementById('musicWrap');
const bgAudio      = document.getElementById('bgAudio');
const musicToggle  = document.getElementById('musicToggle');
const musicFoldBtn = document.getElementById('musicFoldBtn');
const progressWrap = document.getElementById('progressWrap');
const progressBar  = document.getElementById('progressBar');
const progressThumb= document.getElementById('progressThumb');
const curTimeDom   = document.getElementById('curTime');
const durTimeDom   = document.getElementById('durTime');

let isDragging = false;
let hasInteracted = false;
let audioStarted = false;
const TARGET_VOLUME = 0.5;

/* ★ 出现顺序调换：时间先（1.5s），音乐后（2s） */
setTimeout(() => timeBox.classList.add('show'), 1500);
setTimeout(() => musicWrap.classList.add('show'), 2000);

bgAudio.addEventListener('error', (e) => {
  console.error('❌ 音频加载失败，请检查 xinshiyanhuo.mp3 是否与 HTML 在同一目录下：', e);
});
bgAudio.addEventListener('stalled', () => {
  console.warn('⚠️ 音频加载停滞，可能网络或文件路径有问题');
});

musicFoldBtn.addEventListener('click', () => {
  musicWrap.classList.toggle('collapsed');
  musicFoldBtn.textContent = musicWrap.classList.contains('collapsed') ? '◀' : '▶';
});

function formatSec(s){
  if (!isFinite(s) || s < 0) s = 0;
  return padZero(Math.floor(s / 60)) + ':' + padZero(Math.floor(s % 60));
}

bgAudio.addEventListener('play', () => {
  musicToggle.textContent = '⏸';
  musicToggle.classList.add('playing');
});
bgAudio.addEventListener('pause', () => {
  musicToggle.textContent = '▶';
  musicToggle.classList.remove('playing');
});

function startAudioOnce(){
  if (hasInteracted) return;
  hasInteracted = true;

  document.removeEventListener('click', onAnyClick);
  document.removeEventListener('touchend', onAnyTouch);

  bgAudio.volume = 0;
  const playPromise = bgAudio.play();

  const fadeInVolume = () => {
    let v = 0;
    const fadeIn = setInterval(() => {
      v += 0.025;
      if (v >= TARGET_VOLUME){
        v = TARGET_VOLUME;
        clearInterval(fadeIn);
      }
      bgAudio.volume = v;
    }, 60);
  };

  if (playPromise && playPromise.then){
    playPromise.then(() => {
      audioStarted = true;
      fadeInVolume();
    }).catch(err => {
      console.warn('自动播放被浏览器拦截，请手动点击播放按钮：', err);
    });
  } else {
    audioStarted = true;
    fadeInVolume();
  }
}

function onAnyClick(){ startAudioOnce(); }
function onAnyTouch(){ startAudioOnce(); }

document.addEventListener('click', onAnyClick);
document.addEventListener('touchend', onAnyTouch);

musicToggle.addEventListener('click', (e) => {
  e.stopPropagation();

  if (bgAudio.paused){
    if (!audioStarted){
      audioStarted = true;
      bgAudio.volume = TARGET_VOLUME;
    }
    bgAudio.play().catch(err => console.warn(err));
  } else {
    bgAudio.pause();
  }
});

function refreshDuration(){
  if (isFinite(bgAudio.duration)) durTimeDom.innerText = formatSec(bgAudio.duration);
}
bgAudio.addEventListener('loadedmetadata', refreshDuration);
bgAudio.addEventListener('durationchange', refreshDuration);

bgAudio.addEventListener('timeupdate', () => {
  if (isDragging) return;
  const dur = bgAudio.duration;
  if (!isFinite(dur) || dur <= 0) return;
  const pct = bgAudio.currentTime / dur;
  progressBar.style.width = (pct * 100) + '%';
  progressThumb.style.left = (pct * 100) + '%';
  curTimeDom.innerText = formatSec(bgAudio.currentTime);
});

function setProgressByX(clientX){
  const rect = progressWrap.getBoundingClientRect();
  let percent = (clientX - rect.left) / rect.width;
  percent = Math.max(0, Math.min(1, percent));
  progressBar.style.width = (percent * 100) + '%';
  progressThumb.style.left = (percent * 100) + '%';
  const dur = bgAudio.duration;
  if (isFinite(dur) && dur > 0){
    bgAudio.currentTime = percent * dur;
    curTimeDom.innerText = formatSec(bgAudio.currentTime);
  }
}

progressWrap.addEventListener('mousedown', e => {
  e.preventDefault();
  isDragging = true;
  setProgressByX(e.clientX);
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  setProgressByX(e.clientX);
});
document.addEventListener('mouseup', () => { isDragging = false; });

progressWrap.addEventListener('touchstart', e => {
  isDragging = true;
  setProgressByX(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  setProgressByX(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchend', () => { isDragging = false; });
</script>
</body>
</html>
