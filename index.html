<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>生日快乐 | 卡塞尔学院</title>
<style>
:root{
  --gold: #d4af37;
  --gold-bright: #ffd700;
  --gold-soft: rgba(218,165,32,0.75);
  --gold-border: rgba(218,165,32,0.35);
  --gold-glow: rgba(218,165,32,0.45);
  --gold-faint: rgba(218,165,32,0.16);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, sans-serif;
}
body{
  min-height:100dvh;
  background:
    radial-gradient(circle at top left, rgba(218,165,32,0.08), transparent 35%),
    linear-gradient(180deg, #050505 0%, #111111 45%, #080808 100%);
  color:#fff;
  text-align:center;
  position:relative;
  overflow-x:hidden;
}
#canvas{
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  pointer-events:none;
  z-index:1;
}
.wrap{
  position:relative;
  z-index:3;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  padding-bottom:60px;
}
.badge{
  width:186px; height:186px;
  border-radius:50%;
  border:3px solid rgba(218,165,32,0.65);
  background:
    radial-gradient(circle at 35% 25%, rgba(255,215,0,0.12), transparent 35%),
    linear-gradient(135deg, #1a1a1a, #0d0d0d);
  box-shadow:
    0 0 34px var(--gold-glow),
    inset 0 0 22px rgba(218,165,32,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
  position:relative;
  overflow:hidden;
  animation: fadeUp 1.8s cubic-bezier(0.35, 0.1, 0.5, 1) 0.2s both;
}
.badge img{
  width:100%; height:100%;
  object-fit:cover;
  border-radius:50%;
  filter: drop-shadow(0 0 12px rgba(218,165,32,0.65));
}
h1{
  font-size:clamp(2.2rem,9vw,3.2rem);
  color:gold;
  margin-bottom:20px;
  letter-spacing:3px;
  text-shadow:
    0 0 10px rgba(255,215,0,0.75),
    0 0 20px rgba(255,215,0,0.4);
  animation: fadeUp 1.3s cubic-bezier(0.5, 0, 0.75, 0.9) 0.7s both;
}
.content{
  max-width:560px;
  font-size:clamp(1rem,4vw,1.3rem);
  line-height:2;
  color:rgba(255,255,255,0.85);
  background:rgba(18,18,18,0.7);
  border:1px solid rgba(218,165,32,0.28);
  border-radius:16px;
  padding:26px 30px;
  box-shadow:0 0 24px rgba(218,165,32,0.14);
}
.content p{
  margin-bottom:14px;
  opacity:0;
}
.sign{
  margin-top:20px;
  font-size:0.95rem;
  color:rgba(218,165,32,0.78);
  letter-spacing:1px;
}
.dragon-line{
  position:absolute;
  width:200px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(218,165,32,0.65), transparent);
  top:20%; left:50%;
  transform:translateX(-50%);
  box-shadow:0 0 14px var(--gold-glow);
  animation: fadeIn 1.6s cubic-bezier(0.35, 0.1, 0.5, 1) 0.4s both;
}
.bottom-name{
  position:absolute;
  right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font-size:0.95rem;
  color:gold;
  letter-spacing:1px;
  text-shadow:
    0 0 8px rgba(255,215,0,0.8),
    0 0 16px rgba(255,215,0,0.5);
  z-index:4;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  transition: text-shadow 0.3s ease, color 0.3s ease;
  animation: fadeIn 1s cubic-bezier(0.85, 0, 0.9, 0.05) 2.4s both;
}
.bottom-name:hover{
  color:#fff6c9;
  text-shadow:
    0 0 10px rgba(255,215,0,1),
    0 0 22px rgba(255,215,0,0.75),
    0 0 34px rgba(255,215,0,0.45);
}

@keyframes fadeUp{
  from{ opacity:0; transform: translateY(28px); }
  to{ opacity:1; transform: translateY(0); }
}
@keyframes fadeUpLaunch{
  from{ opacity:0; transform: translateY(64px); }
  to{ opacity:1; transform: translateY(0); }
}
@keyframes fadeIn{
  from{ opacity:0; }
  to{ opacity:1; }
}

/* ================= 底部小提示 ================= */
.toast{
  position:fixed;
  left:50%;
  bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(14px) scale(0.95);
  z-index:20;
  background: rgba(12,12,12,0.88);
  border:1px solid rgba(218,165,32,0.55);
  border-radius:999px;
  padding:10px 22px;
  color:gold;
  font-size:0.95rem;
  letter-spacing:1px;
  white-space:nowrap;
  box-shadow: 0 0 22px rgba(218,165,32,0.35);
  opacity:0;
  pointer-events:none;
  animation: toastPop 1.8s ease 0.5s both;
}
@keyframes toastPop{
  0%   { opacity:0; transform: translateX(-50%) translateY(14px) scale(0.95); }
  18%  { opacity:1; transform: translateX(-50%) translateY(0)   scale(1); }
  75%  { opacity:1; transform: translateX(-50%) translateY(0)   scale(1); }
  100% { opacity:0; transform: translateX(-50%) translateY(-6px) scale(0.98); }
}

/* ================= 时间组件（左下，音乐上方） ================= */
.time-box{
  position:fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  z-index:6;
  background:rgba(12,12,12,0.75);
  border:1px solid var(--gold-border);
  border-radius:12px;
  box-shadow:0 0 18px var(--gold-faint);
  display:flex;
  align-items:stretch;
  transform: translateX(calc(-100% - 24px));
  opacity: 0;
  transition: transform 0.7s ease-out, opacity 0.7s ease;
}
.time-box.show{ transform: translateX(0); opacity: 1; }

.time-main{
  width:220px;
  padding:10px 14px;
  text-align:left;
  overflow:hidden;
  transition: width 0.35s ease, padding 0.35s ease;
}
.time-box.collapsed .time-main{
  width:0;
  padding:10px 0;
}

.time-fold-btn{
  width:24px;
  flex:0 0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-soft);
  cursor:pointer;
  border-left:1px solid rgba(218,165,32,0.25);
  border-radius:0 12px 12px 0;
  user-select:none;
}

.time-date{
  font-size:0.8rem;
  color:var(--gold-soft);
  letter-spacing:1px;
  margin-bottom:4px;
  white-space:nowrap;
}
.time-clock{
  font-size:1.3rem;
  color:gold;
  letter-spacing:2px;
  white-space:nowrap;
  text-shadow:0 0 10px rgba(255,215,0,0.6);
}

/* ================= 音乐播放器（左下） ================= */
.music-wrap{
  position:fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index:6;
  background:rgba(12,12,12,0.75);
  border:1px solid var(--gold-border);
  border-radius:12px;
  box-shadow:0 0 18px var(--gold-faint);
  display:flex;
  align-items:stretch;
  transform:translateX(calc(-100% - 24px));
  opacity:0;
  transition:transform 0.7s ease-out, opacity 0.7s ease;
}
.music-wrap.show{ transform:translateX(0); opacity:1; }
.music-main{
  width:220px;
  padding:8px 14px;
  overflow:hidden;
  transition:width 0.35s ease, padding 0.35s ease;
}
.music-wrap.collapsed .music-main{
  width:0;
  padding:8px 0;
}
.music-fold-btn{
  width:24px;
  flex:0 0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-soft);
  cursor:pointer;
  border-left:1px solid rgba(218,165,32,0.25);
  border-radius:0 12px 12px 0;
  user-select:none;
}
.music-title{
  color:gold;
  font-size:0.85rem;
  margin-bottom:8px;
  letter-spacing:1px;
  text-align:center;
  white-space:nowrap;
}

/* ★ 三键控制栏：上一首 | 播放/暂停（中间放大） | 下一首 */
.music-row-top{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-bottom:8px;
}

/* 两侧切歌小按钮 */
.music-prev,
.music-next{
  background:#1c1c1c;
  color:#fff;
  border:1px solid rgba(218,165,32,0.45);
  border-radius:50%;
  width:26px; height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:10px;
  flex-shrink:0;
  transition: all 0.2s ease;
}
.music-prev:hover,
.music-next:hover{
  border-color:gold;
  box-shadow:0 0 8px rgba(218,165,32,0.4);
}
.music-prev:active,
.music-next:active{
  transform: scale(0.9);
}

/* 中间播放/暂停按钮：更大、金色边框更亮 */
.music-toggle{
  background:#1c1c1c;
  color:#fff;
  border:1px solid rgba(218,165,32,0.65);
  border-radius:50%;
  width:38px; height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  flex-shrink:0;
  box-shadow: 0 0 10px rgba(218,165,32,0.25);
  transition: all 0.2s ease;
}
.music-toggle:hover{
  border-color:gold;
  box-shadow:0 0 14px rgba(218,165,32,0.55);
}
.music-toggle.playing{ color:gold; }

.progress-wrap{
  width:100%;
  height:5px;
  background:#222;
  border-radius:3px;
  position:relative;
  cursor:pointer;
  touch-action:none;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
  border-radius:3px;
  width:0%;
}
.progress-thumb{
  position:absolute;
  left:0; top:50%;
  width:11px; height:11px;
  background:gold;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px gold;
}
.time-text{
  display:flex;
  justify-content:space-between;
  font-size:0.7rem;
  color:var(--gold-soft);
  margin-top:3px;
}

audio{ display:none; }

@media(max-width:480px){
  .badge{ width:156px; height:156px; }
  .content{ padding:20px 22px; }

  .bottom-name{
    right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font-size:0.85rem;
  }

  .time-box{
    left: calc(10px + env(safe-area-inset-left, 0px));
    bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  }
  .time-main{ width:180px; padding:8px 12px; }
  .time-clock{ font-size:1.05rem; }
  .time-date{ font-size:0.72rem; }

  .music-wrap{
    left: calc(10px + env(safe-area-inset-left, 0px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .music-main{ width:180px; padding:7px 10px; }

  .music-row-top{ gap:12px; }
  .music-toggle{ width:36px; height:36px; font-size:13px; }
  .music-prev, .music-next{ width:24px; height:24px; font-size:9px; }

  .toast{
    bottom: calc(140px + env(safe-area-inset-bottom, 0px));
    font-size:0.88rem;
    padding:9px 18px;
  }
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- 底部小提示 -->
<div class="toast" id="toast">🎁 有彩蛋，你找找</div>

<!-- 时间组件（左下，音乐上方） -->
<div class="time-box" id="timeBox">
  <div class="time-main">
    <div class="time-date" id="dateDom"></div>
    <div class="time-clock" id="timeDom"></div>
  </div>
  <div class="time-fold-btn" id="timeFoldBtn">▶</div>
</div>

<!-- 音乐播放器（左下） -->
<div class="music-wrap" id="musicWrap">
  <div class="music-main">
    <div class="music-title" id="musicTitle">心似烟火</div>

    <!-- ★ 三键控制：上一首 | 播放/暂停 | 下一首 -->
    <div class="music-row-top">
      <button class="music-prev" id="musicPrev" aria-label="上一首">⏮</button>
      <button class="music-toggle" id="musicToggle" aria-label="播放或暂停">▶</button>
      <button class="music-next" id="musicNext" aria-label="下一首">⏭</button>
    </div>

    <div class="progress-wrap" id="progressWrap" role="slider" aria-label="播放进度">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="time-text">
      <span id="curTime">00:00</span>
      <span id="durTime">00:00</span>
    </div>
  </div>
  <div class="music-fold-btn" id="musicFoldBtn">▶</div>
</div>

<!-- 音频：src 由 JS 控制，去掉 loop -->
<audio id="bgAudio" preload="auto"></audio>

<div class="wrap">
  <div class="dragon-line"></div>
  <div class="badge">
    <img src="https://s41.ax1x.com/2026/10/06/pntkM8J.jpg" alt="徽章">
  </div>
  <h1>生日蛋糕是青春的墓碑</h1>
  <div class="content">
    <p>8月26日，属于你的日子。</p>
    <p>愿新岁，你的黄金瞳永远明亮。</p>
    <p>纵然世间有龙影蛰伏，也愿你被温柔与好运庇护。</p>
    <p>不必活成别人的英雄，只做属于自己的光。</p>
    <p>前路浩荡，万事尽可期待。</p>
    <p class="sign">——卡塞尔学院</p>
  </div>
</div>

<div class="bottom-name" id="bottomName" title="点一下试试？">佟浩嘉</div>

<script src="script.js"></script>
</body>
</html>
